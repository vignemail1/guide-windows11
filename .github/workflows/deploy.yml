name: Déploiement du site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v6

      - name: Installation de uv
        uses: astral-sh/setup-uv@v7

      - name: Installation de Python 3.15
        run: uv python install 3.15

      - name: Installation de zensical
        run: |
          uv venv --python 3.15
          uv pip install zensical

      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v5

      - name: Construction du site
        run: uv run zensical build --clean

      - name: Upload de l'artefact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
